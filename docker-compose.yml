version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: devlaunch-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: devlaunch
    networks:
      - devlaunch-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Unified Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devlaunch-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DEBUG: 'false'
      PORT: 5000
      HOST: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/devlaunch}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-devlaunch_prod_access_secret_min_32_characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-devlaunch_prod_refresh_secret_min_32_characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:80}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - devlaunch-network

  # Frontend (Nginx Production Web Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devlaunch-frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - backend
    networks:
      - devlaunch-network

networks:
  devlaunch-network:
    driver: bridge

volumes:
  mongodb_data:
  uploads_data:
