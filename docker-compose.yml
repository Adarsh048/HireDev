version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: nexhire-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nexhire
    networks:
      - nexhire-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nexhire-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - nexhire-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexhire-backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/nexhire
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - nexhire-network

  # AI Service (Python / FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nexhire-ai-service
    ports:
      - '8000:8000'
    env_file:
      - ./ai-service/.env
    environment:
      DEBUG: 'true'
    volumes:
      - ./ai-service/app:/app/app
    networks:
      - nexhire-network

  # Frontend (Vite dev server — dev only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexhire-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    networks:
      - nexhire-network

volumes:
  mongodb_data:
  redis_data:

networks:
  nexhire-network:
    driver: bridge

