version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: devlaunch-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: devlaunch
    networks:
      - devlaunch-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: devlaunch-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - devlaunch-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devlaunch-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/devlaunch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      PORT: 5000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-devlaunch_prod_access_secret_min_32_characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-devlaunch_prod_refresh_secret_min_32_characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:80}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - devlaunch-network

  # AI Service (Python / FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: devlaunch-ai-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DEBUG: 'false'
      HOST: 0.0.0.0
      PORT: 8000
      SPACY_MODEL: en_core_web_sm
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      BACKEND_URL: http://backend:5000
    networks:
      - devlaunch-network

  # Frontend (Nginx Production Web Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devlaunch-frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - backend
    networks:
      - devlaunch-network

volumes:
  mongodb_data:
  redis_data:
  uploads_data:

networks:
  devlaunch-network:
    driver: bridge
